<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#060a1c">
<title>Opening PDF — Ice Update</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  html,body{margin:0;height:100%;overflow:hidden}
  body{background:radial-gradient(120% 90% at 20% 0%,#10224f 0%,#080d27 55%,#04061a 100%);color:#f4f7ff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .cap{position:fixed;left:0;right:0;bottom:calc(7vh + env(safe-area-inset-bottom));text-align:center;padding:0 22px;font-weight:600;font-size:clamp(.95rem,3.6vw,1.25rem);letter-spacing:.01em;text-shadow:0 2px 14px rgba(0,0,0,.6)}
  .cap b{color:#4de1ff}
  .cap a{color:#4de1ff;font-weight:800}
  .bar{position:fixed;left:50%;transform:translateX(-50%);width:min(320px,70vw);height:5px;border-radius:5px;background:rgba(255,255,255,.14);bottom:calc(3.6vh + env(safe-area-inset-bottom));overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4de1ff,#8b7bff,#ff6bd6)}
  .skip{position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;padding:9px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.35);color:#fff;font:inherit;font-size:.9rem;text-decoration:none}
  noscript{position:fixed;inset:0;display:grid;place-items:center;text-align:center;padding:24px;background:#060a1c}
  noscript a{color:#4de1ff}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<a class="skip" id="skip" href="index.html#downloads">Skip &rsaquo;</a>
<div class="cap" id="cap" role="status">Opening <b id="capTitle">your PDF</b>…</div>
<div class="bar" aria-hidden="true"><i id="barFill"></i></div>
<noscript>Please turn on JavaScript to open this PDF, or <a href="index.html#downloads">go back to the website</a>.</noscript>

<script src="config.js"></script>
<script>
/* =====================================================================
   ICE UPDATE — PDF loader. A 3-second hand-made stick-man animation plays,
   then the PDF opens. The PDF and the broker logos come from config.js,
   so adding a PDF or a broker there needs NO change in this file.
   ===================================================================== */
(function () {
  "use strict";
  var S = window.SITE || {};
  var q = new URLSearchParams(location.search);
  var DEBUG = q.has("debug");            // ?debug=1 -> no redirect, window.__seek(t) available (for testing)
  var TOTAL = 3.0;                        // seconds
  var list = S.pdfs || [];
  var pdf = list[parseInt(q.get("i"), 10)];
  function okUrl(u) { return typeof u === "string" && u && !/^\s*(javascript|vbscript|data):/i.test(u); }
  if (!pdf || !okUrl(pdf.file)) { location.replace("index.html#downloads"); return; }
  var target = pdf.file;
  document.title = "Opening " + (pdf.title || "PDF") + " — Ice Update";
  document.getElementById("capTitle").textContent = pdf.title || "your PDF";
  document.getElementById("skip").href = target;

  /* ---------- broker logos (from config.js) ---------- */
  var brokers = (S.brokers || []).slice(0, 8).map(function (b) {
    var im = new Image(); if (b.logo) im.src = b.logo;
    return { name: b.name || "?", img: b.logo ? im : null };
  });
  if (!brokers.length) brokers = [1, 2, 3, 4].map(function () { return { name: "❄", img: null }; });

  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var bar = document.getElementById("barFill");
  var W = 0, H = 0, DPR = 1, U = 1, cx = 0, groundY = 0, cartX0 = 0, cartX1 = 0, G0 = { x: 0, y: 0 }, pulley = { x: 0, y: 0, r: 0 };
  var tiles = [], tileSize = 0;
  var MAN = "#f4f7ff", ICE = "#4de1ff", GOLD = "#f2aa14", BG = "#060a1c";

  /* ---------- timeline (seconds) ---------- */
  var T_WALK = 0.78, T_CROUCH = 0.88, T_APEX = 0.99, T_PULL = 1.76, T_END = 2.05, T_FADE = 2.74;
  var THMAX = 66 * Math.PI / 180;                      // how far the basket tips
  var PK = [[0, 0], [1.10, 0], [1.20, .16], [1.28, .05], [1.42, .27], [1.50, .12], [1.72, .38], [T_PULL, .38], [T_END, 1], [9, 1]];

  /* ---------- tiny helpers ---------- */
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function sm01(u) { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); }
  function smooth(a, b, t) { return sm01((t - a) / (b - a)); }
  function pullAt(t) {
    for (var i = 1; i < PK.length; i++) if (t <= PK[i][0]) { var a = PK[i - 1], b = PK[i]; return lerp(a[1], b[1], sm01((t - a[0]) / (b[0] - a[0]))); }
    return 1;
  }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  function rot(x, y, a) { var c = Math.cos(a), s = Math.sin(a); return { x: x * c - y * s, y: x * s + y * c }; }
  /* two-bone inverse kinematics: returns the middle joint (elbow / knee) and the end point */
  function ik(x0, y0, tx, ty, l1, l2, dir) {
    var dx = tx - x0, dy = ty - y0, d = Math.hypot(dx, dy) || 1e-6;
    var maxd = l1 + l2 - 0.001, mind = Math.abs(l1 - l2) + 0.001;
    if (d > maxd) { dx *= maxd / d; dy *= maxd / d; d = maxd; }
    if (d < mind) { dx *= mind / d; dy *= mind / d; d = mind; }
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var ux = dx / d, uy = dy / d;
    return { jx: x0 + ux * a - uy * h * dir, jy: y0 + uy * a + ux * h * dir, ex: x0 + dx, ey: y0 + dy };
  }

  /* ---------- layout (re-run on resize) ---------- */
  function layout() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    U = Math.min(W / 6.7, H / 9.5);
    cx = W / 2 - 0.35 * U; groundY = H * 0.70;
    cartX1 = cx - 0.6 * U;                      // where the cart stops
    cartX0 = cartX1 - 4.0 * U;                  // where it starts (just off the left side)
    G0 = { x: cartX1 - 1.05 * U + 0.15 * U, y: groundY - 3.6 * U };   // rope grip, before pulling
    pulley = { x: G0.x + 0.2 * U, y: groundY - 5.0 * U, r: 0.2 * U };
    buildTiles();
  }

  /* ---------- the broker tiles in the cart + their fall (pre-computed so any time can be drawn) ---------- */
  var SIM_DT = 1 / 240;
  function basketPivot(cartX) { return { x: cartX + 1.5 * U, y: groundY - 0.42 * U }; }
  function buildTiles() {
    var n = brokers.length, cols = n <= 6 ? 2 : 3, rows = Math.ceil(n / cols);
    tileSize = U * (cols === 2 ? 0.62 : 0.46);
    var stepY = tileSize * 0.84, r = rng(11);
    tiles = brokers.map(function (b, i) {
      var c = i % cols, row = Math.floor(i / cols);
      var lx = -1.5 * U + (c + 0.5) * (1.45 * U / cols) + (r() - 0.5) * 0.05 * U;
      var ly = -(tileSize / 2 + 0.03 * U) - row * stepY;
      return { b: b, lx: lx, ly: ly, a0: (r() - 0.5) * 0.16, order: 0, rel: 0, tr: 0, traj: null, k: 0 };
    });
    // release order: top / front tiles slide out first
    var idx = tiles.map(function (t, i) { return i; }).sort(function (a, b) { return (tiles[a].ly - tiles[b].ly) || (tiles[b].lx - tiles[a].lx); });
    idx.forEach(function (ti, k) { tiles[ti].k = k; tiles[ti].rel = (27 + k * (31 / Math.max(1, n - 1))) * Math.PI / 180; });
    simulate();
  }
  function thetaAt(t) { return pullAt(t) * THMAX; }
  function simulate() {
    var r = rng(5), g = 10 * U, P = basketPivot(cartX1), steps = Math.round(TOTAL / SIM_DT) + 2;
    tiles.forEach(function (tl) {
      var tr = 0; while (tr < TOTAL && thetaAt(tr) < tl.rel) tr += SIM_DT;
      tl.tr = tr;
      var th = tl.rel, w0 = rot(tl.lx, tl.ly, th);
      var x = P.x + w0.x, y = P.y + w0.y, a = tl.a0 + th;
      var sp = U * (1.15 + tl.k * 0.06 + r() * 0.2);
      var vx = Math.cos(th) * sp, vy = Math.sin(th) * sp, w = (r() - 0.5) * 9;
      var traj = new Float32Array(steps * 3), R = tileSize * 0.62;
      for (var s = Math.round(tr / SIM_DT); s < steps; s++) {
        vy += g * SIM_DT; x += vx * SIM_DT; y += vy * SIM_DT; a += w * SIM_DT;
        if (y + R >= groundY) {
          y = groundY - R;
          if (vy > 0.6 * U) { vy = -vy * 0.36; vx *= 0.8; w *= 0.6; } else { vy = 0; vx *= 0.9; w *= 0.85; }
        }
        traj[s * 3] = x; traj[s * 3 + 1] = y; traj[s * 3 + 2] = a;
      }
      tl.traj = traj;
    });
  }

  /* ---------- drawing primitives ---------- */
  function line(ax, ay, bx, by) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(bx, by); ctx.stroke(); }
  function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); fill ? ctx.fill() : ctx.stroke(); }
  function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function limb(ax, ay, jx, jy, ex, ey) { ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(jx, jy); ctx.lineTo(ex, ey); ctx.stroke(); }

  function drawTile(tl, x, y, a) {                   // centered at x,y
    var s = tileSize, h = s / 2;
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.shadowColor = "rgba(0,0,0,.35)"; ctx.shadowBlur = 0.1 * U; ctx.shadowOffsetY = 0.03 * U;
    ctx.fillStyle = "#fff"; rrect(-h, -h, s, s, s * 0.2); ctx.fill();
    ctx.shadowColor = "transparent"; ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
    var im = tl.b.img;
    if (im && im.complete && im.naturalWidth) {
      var pad = s * 0.07, bw = s - pad * 2, k = Math.min(bw / im.naturalWidth, bw / im.naturalHeight), dw = im.naturalWidth * k, dh = im.naturalHeight * k;
      ctx.save(); rrect(-h, -h, s, s, s * 0.2); ctx.clip(); ctx.drawImage(im, -dw / 2, -dh / 2, dw, dh); ctx.restore();
    } else {
      var g = ctx.createLinearGradient(-h, -h, h, h); g.addColorStop(0, "#4de1ff"); g.addColorStop(1, "#8b7bff");
      ctx.fillStyle = g; rrect(-h * 0.86, -h * 0.86, s * 0.86, s * 0.86, s * 0.16); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "800 " + (s * 0.38) + "px Sora,Inter,sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(tl.b.name).slice(0, 2), 0, 0);
    }
    ctx.lineWidth = Math.max(1, s * 0.03); ctx.strokeStyle = "rgba(255,255,255,.55)"; rrect(-h, -h, s, s, s * 0.2); ctx.stroke();
    ctx.restore();
  }

  /* ---------- the stick man ---------- */
  function manPose(t, cartX, dist, p, G) {
    var legLen = 1.05 * U, tors = 0.85 * U, stand = groundY - legLen * 0.985, m = {};
    var hx = cartX - 1.05 * U, hy, lean = 0.14, face = "smile";
    var grip = { x: cartX - 0.42 * U, y: groundY - 1.37 * U };
    var hang = G.y + 1.69 * U;                           // hip height when hanging from the rope
    var hand1, hand2, feet = [], dir1 = 1, dir2 = 1;
    var walkBlend = 1 - smooth(0.70, 0.80, t), s = dist / (0.68 * U) * Math.PI;
    function walkFoot(k) {
      var ph = s + k * Math.PI, sx = Math.sin(ph) * 0.34 * U, lift = Math.max(0, -Math.cos(ph)) * 0.16 * U;
      var fx = lerp(hx + (k ? 0.14 : -0.14) * U, hx + sx, walkBlend), fy = groundY - lift * walkBlend;
      return { x: fx, y: fy };
    }
    if (t < T_CROUCH) {
      hy = stand + 0.03 * U * Math.abs(Math.sin(s)) * walkBlend + smooth(T_WALK, T_CROUCH, t) * 0.20 * U;
      lean = lerp(0.14, 0.08, smooth(T_WALK, T_CROUCH, t));
      hand1 = { x: grip.x, y: grip.y }; hand2 = { x: grip.x + 0.06 * U, y: grip.y + 0.05 * U };
      feet = [walkFoot(0), walkFoot(1)];
      face = t > T_WALK ? "focus" : "smile";
    } else if (t < T_APEX) {
      var u = (t - T_CROUCH) / (T_APEX - T_CROUCH), e = 1 - Math.pow(1 - u, 2);
      var from = stand + 0.20 * U;
      hy = lerp(from, hang, e); lean = lerp(0.08, 0, e);
      var hb = smooth(0.0, 1.0, u * 1.25);
      hand1 = { x: lerp(grip.x, G.x - 0.03 * U, hb), y: lerp(grip.y, G.y, hb) };
      hand2 = { x: lerp(grip.x + 0.06 * U, G.x + 0.03 * U, hb), y: lerp(grip.y + 0.05 * U, G.y - 0.13 * U, hb) };
      var tuck = Math.sin(u * Math.PI);
      feet = [{ x: hx - 0.1 * U, y: Math.min(groundY, hy + legLen * (0.95 - 0.35 * tuck)) }, { x: hx + 0.16 * U, y: Math.min(groundY, hy + legLen * (0.95 - 0.5 * tuck)) }];
      face = "o";
    } else if (t < T_END) {
      var strain = t < T_PULL ? 1 : 1.4;
      var sh = Math.sin(t * 58) * 0.012 * U * strain;
      hy = hang + sh; lean = 0.02 * Math.sin(t * 9);
      hand1 = { x: G.x - 0.03 * U, y: G.y }; hand2 = { x: G.x + 0.03 * U, y: G.y - 0.13 * U };
      var kick = Math.sin(t * 17) * 0.26 * U * (t < T_PULL ? 1 : 0.4);
      feet = [{ x: hx + 0.12 * U + kick, y: Math.min(groundY, hy + legLen * 0.97 - Math.max(0, -Math.cos(t * 17)) * 0.1 * U) },
              { x: hx + 0.12 * U - kick, y: Math.min(groundY, hy + legLen * 0.97 - Math.max(0, Math.cos(t * 17)) * 0.1 * U) }];
      dir1 = -1; dir2 = 1;
      face = t < T_PULL ? "strain" : "roar";
      m.sweat = true;
    } else {
      var uu = smooth(T_END, T_END + 0.12, t), hopU = clamp((t - 2.25) / 0.26, 0, 1);
      hy = lerp(hang, stand, uu) - 0.22 * U * 4 * hopU * (1 - hopU); lean = lerp(0, -0.06, uu);
      var sx = hx + 0.1 * U;
      hand1 = { x: lerp(G.x - 0.03 * U, 0, 1), y: 0 }; hand2 = hand1;             // placeholders, set below
      var shY = hy - tors, shX = hx + Math.sin(lean) * tors;
      var arm = smooth(T_END, T_END + 0.14, t);
      hand1 = { x: lerp(G.x - 0.03 * U, shX - 0.55 * U, arm), y: lerp(G.y, shY - 0.78 * U, arm) };
      hand2 = { x: lerp(G.x + 0.03 * U, shX + 0.55 * U, arm), y: lerp(G.y - 0.13 * U, shY - 0.78 * U, arm) };
      var stance = 0.2 * U * (1 - uu), air = 4 * hopU * (1 - hopU) * 0.28 * U;
      feet = [{ x: hx - 0.14 * U - stance * 0, y: groundY - air }, { x: hx + 0.14 * U, y: groundY - air }];
      dir1 = -1; dir2 = 1; face = "happy";
    }
    m.hx = hx; m.hy = hy; m.lean = lean; m.face = face;
    var shx = hx + Math.sin(m.lean) * tors, shy = hy - Math.cos(m.lean) * tors;
    m.hip = { x: hx, y: hy }; m.sh = { x: shx, y: shy };
    m.head = { x: shx + Math.sin(m.lean) * 0.33 * U, y: shy - Math.cos(m.lean) * 0.33 * U };
    m.arms = [ik(shx, shy, hand1.x, hand1.y, 0.45 * U, 0.45 * U, dir1), ik(shx, shy, hand2.x, hand2.y, 0.45 * U, 0.45 * U, dir2)];
    m.legs = feet.map(function (f, i) { return ik(hx, hy, f.x, f.y, 0.52 * U, 0.53 * U, -1); });
    return m;
  }

  function drawMan(m, t) {
    var lw = Math.max(3, 0.075 * U);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = lw; ctx.strokeStyle = MAN;
    ctx.shadowColor = "rgba(77,225,255,.55)"; ctx.shadowBlur = 0.1 * U;
    ctx.globalAlpha = 0.8;                                   // far limbs a little dimmer
    var A0 = m.arms[0], L0 = m.legs[0];
    limb(m.sh.x, m.sh.y, A0.jx, A0.jy, A0.ex, A0.ey);
    limb(m.hip.x, m.hip.y, L0.jx, L0.jy, L0.ex, L0.ey); line(L0.ex, L0.ey, L0.ex + 0.13 * U, L0.ey);
    ctx.globalAlpha = 1;
    line(m.hip.x, m.hip.y, m.sh.x, m.sh.y);                  // torso
    var A1 = m.arms[1], L1 = m.legs[1];
    limb(m.sh.x, m.sh.y, A1.jx, A1.jy, A1.ex, A1.ey);
    limb(m.hip.x, m.hip.y, L1.jx, L1.jy, L1.ex, L1.ey); line(L1.ex, L1.ey, L1.ex + 0.13 * U, L1.ey);
    // head + face
    var hr = 0.27 * U; ctx.fillStyle = BG; circle(m.head.x, m.head.y, hr, true); ctx.stroke();
    ctx.shadowBlur = 0; ctx.lineWidth = Math.max(2, 0.04 * U);
    var ex = hr * 0.38, ey = -hr * 0.1, hx = m.head.x + hr * 0.12, hy = m.head.y;
    var f = m.face;
    ctx.fillStyle = MAN;
    if (f === "smile" || f === "focus" || f === "o") {
      circle(hx - ex, hy + ey, hr * 0.09, true); circle(hx + ex, hy + ey, hr * 0.09, true);
    } else if (f === "happy") {
      ctx.beginPath(); ctx.arc(hx - ex, hy + ey + hr * 0.08, hr * 0.14, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
      ctx.beginPath(); ctx.arc(hx + ex, hy + ey + hr * 0.08, hr * 0.14, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    } else {                                               // strain / roar: squeezed eyes  > <
      line(hx - ex - hr * 0.14, hy + ey - hr * 0.1, hx - ex + hr * 0.1, hy + ey); line(hx - ex - hr * 0.14, hy + ey + hr * 0.1, hx - ex + hr * 0.1, hy + ey);
      line(hx + ex + hr * 0.14, hy + ey - hr * 0.1, hx + ex - hr * 0.1, hy + ey); line(hx + ex + hr * 0.14, hy + ey + hr * 0.1, hx + ex - hr * 0.1, hy + ey);
    }
    var my = hy + hr * 0.42;
    if (f === "smile" || f === "happy") { ctx.beginPath(); ctx.arc(hx, my - hr * 0.16, hr * 0.3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke(); }
    else if (f === "focus") line(hx - hr * 0.18, my, hx + hr * 0.18, my);
    else if (f === "o") circle(hx, my, hr * 0.13, false);
    else { ctx.beginPath(); ctx.moveTo(hx - hr * 0.3, my - hr * 0.02); for (var i = 1; i <= 4; i++) ctx.lineTo(hx - hr * 0.3 + i * hr * 0.15, my + (i % 2 ? 1 : -1) * hr * 0.08); ctx.stroke(); }
    // sweat drops while struggling
    if (m.sweat) {
      ctx.fillStyle = "#9fe8ff";
      for (var k = 0; k < 6; k++) {
        var u = ((t * 2.3 + k * 0.37) % 1), dir = (k % 2 ? 1 : -1) * (0.5 + (k % 3) * 0.3);
        ctx.globalAlpha = 1 - u; circle(m.head.x + dir * hr * 0.9 + dir * u * 0.45 * U, m.head.y - hr * 0.7 + u * u * 0.9 * U, 0.04 * U, true);
      }
      ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = 0;
  }

  /* ---------- the cart, rope and pulley ---------- */
  function drawCart(cartX, dist, th, t) {
    var P = basketPivot(cartX), lw = Math.max(2.4, 0.05 * U);
    ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.lineWidth = lw; ctx.strokeStyle = ICE;
    // chassis + wheels
    line(cartX + 0.05 * U, groundY - 0.34 * U, cartX + 1.5 * U, groundY - 0.34 * U);
    [0.25, 1.25].forEach(function (wx) {
      var x = cartX + wx * U, y = groundY - 0.15 * U, a = dist / (0.15 * U);
      line(x, groundY - 0.34 * U, x, y);
      circle(x, y, 0.15 * U, false);
      line(x - Math.cos(a) * 0.15 * U, y - Math.sin(a) * 0.15 * U, x + Math.cos(a) * 0.15 * U, y + Math.sin(a) * 0.15 * U);
    });
    // tipping basket (everything inside is drawn in basket space)
    ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(th);
    ctx.fillStyle = "rgba(77,225,255,.09)";
    ctx.beginPath(); ctx.moveTo(-1.45 * U, 0); ctx.lineTo(0, 0); ctx.lineTo(0.05 * U, -0.95 * U); ctx.lineTo(-1.5 * U, -0.95 * U); ctx.closePath(); ctx.fill();
    tiles.forEach(function (tl) { if (t < tl.tr) drawTile(tl, tl.lx, tl.ly, tl.a0); });
    ctx.strokeStyle = ICE; ctx.beginPath(); ctx.moveTo(-1.45 * U, 0); ctx.lineTo(0, 0); ctx.lineTo(0.05 * U, -0.95 * U); ctx.lineTo(-1.5 * U, -0.95 * U); ctx.closePath(); ctx.stroke();
    ctx.lineWidth = lw * 0.45; ctx.globalAlpha = 0.55;
    for (var i = 1; i < 6; i++) line(-1.5 * U + i * 0.25 * U, 0, -1.5 * U + i * 0.25 * U + 0.01 * U, -0.95 * U);
    line(-1.47 * U, -0.32 * U, 0.02 * U, -0.32 * U); line(-1.48 * U, -0.64 * U, 0.04 * U, -0.64 * U);
    ctx.globalAlpha = 1; ctx.lineWidth = lw;
    line(-1.5 * U, -0.95 * U, -1.92 * U, -0.98 * U);        // handle
    ctx.lineWidth = lw * 1.5; line(-1.92 * U, -0.98 * U, -1.76 * U, -0.97 * U);
    ctx.fillStyle = "#0a1030"; ctx.lineWidth = lw * 0.7; circle(0, 0, 0.05 * U, true); circle(0, 0, 0.05 * U, false);
    ctx.restore();
  }

  function drawRope(cartX, th, G, t) {
    var P = basketPivot(cartX), R = rot(-1.5 * U, -0.95 * U, th), att = smooth(0.55, 0.78, t);
    var rx = lerp(pulley.x + pulley.r, P.x + R.x, att), ry = lerp(groundY - 1.37 * U, P.y + R.y, att);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = Math.max(2, 0.04 * U);
    line(pulley.x, pulley.y, pulley.x, -20);                                // ceiling bar
    ctx.strokeStyle = GOLD; ctx.lineWidth = Math.max(3, 0.055 * U);
    line(pulley.x - pulley.r, pulley.y, G.x, G.y + 0.3 * U);                  // rope the man pulls
    ctx.beginPath(); ctx.arc(pulley.x, pulley.y, pulley.r, Math.PI, 2 * Math.PI, false); ctx.stroke();
    line(pulley.x + pulley.r, pulley.y, rx, ry);                              // rope to the basket
    if (att < 1) { ctx.fillStyle = GOLD; circle(rx, ry, 0.06 * U, true); }
    ctx.strokeStyle = "#c9d4f5"; ctx.lineWidth = Math.max(2.4, 0.045 * U); circle(pulley.x, pulley.y, pulley.r * 0.9, false);
    ctx.fillStyle = "#c9d4f5"; circle(pulley.x, pulley.y, pulley.r * 0.22, true);
    ctx.fillStyle = GOLD; circle(G.x, G.y + 0.3 * U, 0.075 * U, true);        // knot
  }

  /* ---------- one frame at time t ---------- */
  function render(t) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.clearRect(0, 0, W, H);
    var u = clamp(t / T_WALK, 0, 1), e = 1 - Math.pow(1 - u, 2.2);
    var cartX = lerp(cartX0, cartX1, e), dist = cartX - cartX0;
    var p = pullAt(t), th = p * THMAX;
    // rope grip goes down by exactly as much as the basket's back edge goes up
    var R0 = rot(-1.5 * U, -0.95 * U, 0), R1 = rot(-1.5 * U, -0.95 * U, th);
    var G = { x: G0.x, y: G0.y + (R0.y - R1.y) };
    var fadeIn = clamp(t / 0.18, 0, 1), fadeOut = smooth(T_FADE, TOTAL, t);
    ctx.globalAlpha = fadeIn;
    // ground
    var gl = ctx.createLinearGradient(0, 0, W, 0); gl.addColorStop(0, "rgba(255,255,255,0)"); gl.addColorStop(0.5, "rgba(255,255,255,.3)"); gl.addColorStop(1, "rgba(255,255,255,0)");
    ctx.strokeStyle = gl; ctx.lineWidth = 2; line(0, groundY + 2, W, groundY + 2);
    var man = manPose(t, cartX, dist, p, G);
    ctx.fillStyle = "rgba(0,0,0,.28)";
    [[cartX + 0.75 * U, 0.95 * U], [man.hx, 0.5 * U]].forEach(function (s) { ctx.beginPath(); ctx.ellipse(s[0], groundY + 3, s[1], 0.06 * U, 0, 0, 6.2832); ctx.fill(); });
    drawRope(cartX, th, G, t);
    drawCart(cartX, dist, th, t);
    // tiles that have left the basket
    var si = Math.min(Math.round(t / SIM_DT), Math.round(TOTAL / SIM_DT));
    tiles.forEach(function (tl) { if (t >= tl.tr && tl.traj) drawTile(tl, tl.traj[si * 3], tl.traj[si * 3 + 1], tl.traj[si * 3 + 2]); });
    drawMan(man, t);
    ctx.globalAlpha = 1;
    if (fadeOut > 0) { ctx.fillStyle = "rgba(6,10,28," + fadeOut + ")"; ctx.fillRect(0, 0, W, H); }
    bar.style.width = (clamp(t / TOTAL, 0, 1) * 100) + "%";
  }

  /* ---------- run ---------- */
  var finished = false;
  function finish() { if (finished) return; finished = true; location.replace(target); }
  function showManual() {
    var c = document.getElementById("cap"); c.innerHTML = "";
    var a = document.createElement("a"); a.href = target; a.textContent = "Tap here if your PDF didn’t open"; c.appendChild(a);
  }
  layout();
  window.addEventListener("resize", function () { layout(); });
  if (DEBUG) { window.__seek = function (t) { render(t); }; render(0); return; }
  if (matchMedia("(prefers-reduced-motion:reduce)").matches) { render(2.6); setTimeout(finish, 900); setTimeout(showManual, 3000); return; }
  var t0 = null;
  function frame(now) {
    if (finished) return;
    if (t0 === null) t0 = now;
    var t = (now - t0) / 1000;
    render(Math.min(t, TOTAL));
    if (t >= TOTAL) { finish(); return; }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  setTimeout(finish, (TOTAL + 0.6) * 1000);          // safety net if the browser pauses animation frames
  setTimeout(showManual, 4200);                      // in case the PDF is downloaded instead of shown
})();
</script>
</body>
